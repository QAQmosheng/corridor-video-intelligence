[service]
module_id = "corridor-native-vision"
timezone = "Asia/Shanghai"
schema_version = "1.0"

[paths]
evidence_dir = "../runtime/evidence"
database = "../runtime/events-native.db"

[baseline]
pixel_threshold = 18
changed_area_ratio = 0.012
global_change_ratio = 0.42
stable_confirm_frames = 3
clear_confirm_frames = 5
learning_rate = 0.015

[vision]
baseline_width = 640
baseline_height = 360
min_component_ratio = 0.001
red_helmet_ratio = 0.12
ignore_top_ratio = 0.10
change_mask_dilate_iterations = 2
portable_min_center_y_ratio = 0.52
portable_max_area_ratio = 0.08
portable_max_blue_ratio = 0.30
portable_max_red_ratio = 0.25
portable_min_material_ratio = 0.22
box_hue_min = 10
box_hue_max = 32
box_saturation_min = 35
box_min_area_ratio = 0.00025
box_max_area_ratio = 0.012
box_max_aspect = 2.4
person_min_aspect = 1.45
person_group_min_height_ratio = 0.18
person_group_red_hint_ratio = 0.008
person_group_width_height_ratio = 0.68
emit_unknown_person_candidates = false
helmet_min_area_ratio = 0.000015
helmet_max_area_ratio = 0.004
helmet_anchor_max_y_ratio = 0.92
helmet_person_width_scale = 3.0
helmet_person_height_scale = 9.0

[person]
helmet_confirm_frames = 3
emit_worker_detected = true

[session]
exit_confirmation_seconds = 6.0
max_camera_transit_seconds = 12.0
camera_stale_seconds = 15.0
abandoned_persistence_seconds = 8.0
object_missing_grace_seconds = 2.0
object_match_iou = 0.15
object_match_center_pixels = 120.0
offline_blocks_abandoned = true

[events]
cooldown_seconds = 30.0
snapshot_format = "jpg"
snapshot_quality = 90

[lifecycle]
# Frame-level detections become an alarm only after this many consecutive hits.
confirm_frames = 3
# An active alarm closes only after this many consecutive missing observations.
clear_frames = 15
# It must also remain absent for this duration, independent of input frame rate.
clear_seconds = 5.0
# Same category + overlapping box is treated as the same continuing incident.
spatial_iou_threshold = 0.35
# These have already completed their own business confirmation state machine.
immediate_types = ["abandoned_object", "worker_detected"]

[vlm]
enabled = false
provider = "openai_compatible"
endpoint = "http://127.0.0.1:8000/v1/chat/completions"
model = "vision-model"
api_key_env = "VIDEO_VLM_API_KEY"
timeout_seconds = 15.0
max_retries = 2

[weknora]
enabled = false
endpoint = "http://127.0.0.1/api/v1/events"
api_key_env = "WEKNORA_EVENT_API_KEY"
timeout_seconds = 10.0

[[cameras]]
camera_id = "CAM-A"
corridor_id = "CORRIDOR-01"
name = "东入口"
location = "综合舱东入口"
source = "demo://camera-a"
order = 1

[[cameras]]
camera_id = "CAM-B"
corridor_id = "CORRIDOR-01"
name = "检修段"
location = "综合舱检修段"
source = "demo://camera-b"
order = 2

[[cameras]]
camera_id = "CAM-C"
corridor_id = "CORRIDOR-01"
name = "西出口"
location = "综合舱西出口"
source = "demo://camera-c"
order = 3
